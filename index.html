<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPE Tokenizer Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navbar -->
        <header class="header">
            <div class="brand">
                <span class="brand-name">BPE Tokenizer</span>
            </div>
            
            <!-- Main Navigation Tabs -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="tab-playground">Playground</button>
                <button class="tab-btn" data-tab="tab-trainer">Train & Vocabulary</button>
            </div>
        </header>

        <!-- TAB 1: PLAYGROUND (Super Clean & Focused) -->
        <main id="tab-playground" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <label for="test-text">Input Text</label>
                    <div class="preset-links">
                        <span>Sample:</span>
                        <button class="link-btn" data-sample="multilingual">Multilingual</button>
                        <button class="link-btn" data-sample="english">English</button>
                        <button class="link-btn" data-sample="code">Code</button>
                    </div>
                </div>
                <textarea id="test-text" rows="4" placeholder="Type or paste any text here to see subword tokens..."></textarea>

                <div class="token-result-box">
                    <div class="box-header">
                        <span class="box-title">Subword Tokens</span>
                        <div class="stats-row">
                            <span class="stat-tag"><strong id="stat-tokens">0</strong> tokens</span>
                            <span class="stat-tag"><strong id="stat-chars">0</strong> chars</span>
                        </div>
                    </div>
                    <div class="tokens-container" id="token-pills">
                        <span class="placeholder-text">Type text above...</span>
                    </div>
                </div>

                <div class="code-result-box">
                    <div class="box-header">
                        <span class="box-title">Token IDs</span>
                        <button id="btn-copy-ids" class="btn-sm">Copy IDs</button>
                    </div>
                    <div class="code-display" id="token-ids-output">[ ]</div>
                </div>
            </div>
        </main>

        <!-- TAB 2: TRAINER & VOCABULARY -->
        <main id="tab-trainer" class="tab-content">
            <div class="grid-2col">
                <!-- Training Card -->
                <div class="card">
                    <div class="card-header">
                        <h2>1. Model Training</h2>
                    </div>

                    <div class="field">
                        <label for="train-text">Training Text Corpus</label>
                        <textarea id="train-text" rows="4" placeholder="Enter corpus text to learn BPE vocabulary..."></textarea>
                    </div>

                    <div class="field-row">
                        <div class="field flex-1">
                            <label for="target-vocab">Target Vocab Size</label>
                            <input type="number" id="target-vocab" value="300" min="260" max="1000">
                        </div>
                        <div class="field flex-1">
                            <label for="model-regex-select">Regex Rule</label>
                            <select id="model-regex-select" class="select-input">
                                <option value="gpt2">GPT-2 / GPT-3</option>
                                <option value="gpt4">GPT-4 (cl100k)</option>
                                <option value="llama3">Llama 3</option>
                                <option value="whitespace">Whitespace</option>
                            </select>
                        </div>
                    </div>

                    <button id="btn-train" class="btn-primary">Train Tokenizer</button>

                    <div class="field margin-top">
                        <label>Step Playback: <span id="current-step-label">Step Max</span></label>
                        <input type="range" id="merge-step-slider" min="0" max="0" value="0" class="range-slider">
                    </div>

                    <div class="field">
                        <label>Learned Merges (<span id="merges-count">0</span>)</label>
                        <div class="merges-list" id="merges-list"></div>
                    </div>
                </div>

                <!-- Vocabulary Table Card -->
                <div class="card">
                    <div class="card-header">
                        <h2>2. Vocabulary Explorer</h2>
                        <input type="text" id="vocab-search" placeholder="Search ID or Token..." class="search-input">
                    </div>

                    <div class="table-container">
                        <table class="vocab-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Token String</th>
                                    <th>Type</th>
                                </tr>
                            </thead>
                            <tbody id="vocab-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
