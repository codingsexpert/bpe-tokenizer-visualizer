<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPE Tokenizer Playground</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Top Navigation Header -->
        <header class="navbar">
            <div class="brand">
                <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <rect x="9" y="9" width="6" height="6"/>
                    <line x1="9" y1="1" x2="9" y2="4"/>
                    <line x1="15" y1="1" x2="15" y2="4"/>
                    <line x1="9" y1="20" x2="9" y2="23"/>
                    <line x1="15" y1="20" x2="15" y2="23"/>
                    <line x1="20" y1="9" x2="23" y2="9"/>
                    <line x1="20" y1="15" x2="23" y2="15"/>
                    <line x1="1" y1="9" x2="4" y2="9"/>
                    <line x1="1" y1="15" x2="4" y2="15"/>
                </svg>
                <span class="brand-title">BPE Tokenizer</span>
            </div>
            
            <div class="nav-presets">
                <span class="nav-label">Preset:</span>
                <button class="preset-tab active" data-preset="multilingual">Multilingual</button>
                <button class="preset-tab" data-preset="classic">Classic BPE</button>
                <button class="preset-tab" data-preset="code">Code & Symbols</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="main-container">
            <!-- Left Side: Interactive Tokenization Playground -->
            <section class="card main-card">
                <div class="card-title-bar">
                    <h2>Live Tokenizer</h2>
                    <div class="stats-pills">
                        <span class="stat-pill"><strong id="stat-chars">0</strong> chars</span>
                        <span class="stat-pill accent"><strong id="stat-tokens">0</strong> tokens</span>
                        <span class="stat-pill"><strong id="stat-ratio">0.0</strong> ratio</span>
                    </div>
                </div>

                <div class="input-container">
                    <textarea id="test-text" placeholder="Type text here to visualize subword tokens in real-time..."></textarea>
                </div>

                <div class="output-section">
                    <div class="output-title-row">
                        <label>Subword Tokens</label>
                        <label class="toggle-control">
                            <input type="checkbox" id="show-ids-toggle" checked>
                            <span>Token IDs</span>
                        </label>
                    </div>

                    <div class="tokens-wrapper" id="token-pills">
                        <span class="placeholder-text">Type text above...</span>
                    </div>
                </div>

                <div class="output-section margin-top-sm">
                    <div class="output-title-row">
                        <label>Token ID Array</label>
                        <button id="btn-copy-ids" class="btn-secondary">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            Copy IDs
                        </button>
                    </div>
                    <div class="code-box" id="token-ids-output">[ ]</div>
                </div>
            </section>

            <!-- Right Side: Training & Vocabulary Inspector -->
            <aside class="sidebar">
                <!-- Training Controls Card -->
                <div class="card sidebar-card">
                    <div class="card-title-bar">
                        <h2>Vocabulary Settings</h2>
                    </div>

                    <div class="form-field">
                        <label for="train-text">Training Corpus</label>
                        <textarea id="train-text" rows="3" placeholder="Corpus text for learning merges..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-field flex-1">
                            <label for="target-vocab">Target Vocab</label>
                            <input type="number" id="target-vocab" value="300" min="260" max="1000">
                        </div>
                        <div class="form-field flex-1">
                            <label for="max-merges">Merges</label>
                            <input type="number" id="max-merges" value="44" readonly>
                        </div>
                    </div>

                    <button id="btn-train" class="btn-primary">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        Train Model
                    </button>

                    <div class="merges-container">
                        <label>Learned Merges (<span id="merges-count">0</span>)</label>
                        <div class="merges-scroll-box" id="merges-list"></div>
                    </div>
                </div>

                <!-- Vocabulary Table -->
                <div class="card sidebar-card flex-1">
                    <div class="card-title-bar">
                        <h2>Vocabulary</h2>
                        <input type="text" id="vocab-search" placeholder="Search ID or Token..." class="search-box">
                    </div>
                    <div class="table-scroll-container">
                        <table class="simple-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Token</th>
                                    <th>Type</th>
                                </tr>
                            </thead>
                            <tbody id="vocab-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
